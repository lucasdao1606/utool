[server]
headless = true
enableCORS = false
enableXsrfProtection = true
maxUploadSize = 100
# Giới hạn số lượng kết nối xử lý đồng thời (ví dụ: 10)
maxThreads = 3

[theme]
base = "dark"
primaryColor = "#2563EB"
backgroundColor = "#0F172A"
secondaryBackgroundColor = "#1E293B"
textColor = "#F8FAFC"
font = "sans serif"

